<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030806"><title>ROAD 95 — Foundation Athlete</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030806;font-family:Inter,system-ui,sans-serif}.front{position:relative;width:min(100vw,1586px);margin:auto;line-height:0}.front-img{display:block;width:100%;height:auto}.hit{position:absolute;border:0;background:transparent;color:transparent;cursor:pointer}.hit:focus-visible{outline:2px solid #caff3a}.modal{display:none;position:absolute;z-index:20;left:23%;top:22%;width:54%;padding:22px;background:#080d0a;border:1px solid #caff3a;border-radius:14px;box-shadow:0 20px 90px #000;color:#fff;line-height:1.4}.modal.open{display:block}.modal h2{margin:0 0 14px}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fields input{min-width:0;padding:11px;background:#030705;color:#fff;border:1px solid #465047;border-radius:8px}.save,.close{border:1px solid #caff3a;background:#caff3a;color:#071008;border-radius:8px;padding:9px 13px;font-weight:900;cursor:pointer}.close{float:right;background:#0b110d;color:#caff3a}.save{margin-top:12px}@media(max-width:700px){.modal{position:fixed;left:4%;top:18%;width:92%}.fields{grid-template-columns:1fr 1fr}}
</style></head><body><main class="front"><img class="front-img" alt="ROAD 95 daily control center" src="assets/road95-front-exact.png?v=20260908-1725">
<button class="hit" data-open="Back Squat" style="left:27%;top:30%;width:7%;height:5%">Add Back Squat</button><button class="hit" data-open="Bench Press" style="left:27%;top:40.5%;width:7%;height:5%">Add Bench Press</button><button class="hit" data-open="Barbell Row" style="left:27%;top:51%;width:7%;height:5%">Add Barbell Row</button><button class="hit" id="media" style="left:82%;top:56%;width:15%;height:5%">Add photo or video</button><input type="file" id="file" accept="image/*,video/*" hidden>
<section class="modal" id="modal"><button class="close" id="close">CLOSE ×</button><h2 id="title">Record exercise</h2><div class="fields"><input id="kg" type="number" step=".5" placeholder="Weight kg"><input id="sets" type="number" placeholder="Sets"><input id="reps" placeholder="Reps"><input id="rir" type="number" placeholder="RIR"></div><button class="save" id="save">SAVE EXERCISE</button></section></main><script>
const KEY='road95_exact_logs';let logs={};try{logs=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let active='';const q=s=>document.querySelector(s);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{active=b.dataset.open;const v=logs[active]||{};q('#title').textContent='Record · '+active;q('#kg').value=v.kg||'';q('#sets').value=v.sets||'';q('#reps').value=v.reps||'';q('#rir').value=v.rir||'';q('#modal').classList.add('open')});q('#close').onclick=()=>q('#modal').classList.remove('open');q('#save').onclick=()=>{logs[active]={kg:q('#kg').value,sets:q('#sets').value,reps:q('#reps').value,rir:q('#rir').value};localStorage.setItem(KEY,JSON.stringify(logs));q('#modal').classList.remove('open')};q('#media').onclick=()=>q('#file').click();
</script></body></html>
